name: Build and release Windows app

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          tag="v$(bash scripts/next-version.sh)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  reserve-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          tag_reserved=false
          for attempt in $(seq 1 20); do
            git fetch --force --tags origin
            tag=$(git tag --points-at "$RELEASE_SHA" --list 'v[0-9]*' | sort -V | tail -n 1)
            if [[ -n "$tag" ]]; then
              tag_reserved=true
              break
            fi

            tag="v$(bash scripts/next-version.sh)"
            existing_sha=$(git rev-parse --verify "refs/tags/${tag}^{commit}" 2>/dev/null || true)
            if [[ -n "$existing_sha" ]]; then
              sleep 1
              continue
            fi
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" -f sha="${RELEASE_SHA}" >/dev/null; then
              tag_reserved=true
              break
            fi
            sleep 1
          done
          if [[ "$tag_reserved" != true ]]; then
            echo 'Could not reserve a version tag.' >&2
            exit 1
          fi
          git fetch --force --tags origin
          tag_sha=$(git rev-parse --verify "refs/tags/${tag}^{commit}")
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "Tag $tag points to $tag_sha, expected $RELEASE_SHA." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: [version, reserve-version]
    if: >-
      !cancelled() &&
      (needs.version.result == 'success' || needs.reserve-version.result == 'success')
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64 and GTK4/Libadwaita dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-pyinstaller
            unzip
            zip

      - name: Run offline tests
        env:
          NO_AT_BRIDGE: '1'
          GTK_A11Y: none
          GSK_RENDERER: cairo
        run: /ucrt64/bin/python.exe -m unittest discover -s tests -v

      - name: Build Windows executable bundle
        run: |
          /ucrt64/bin/pyinstaller.exe --noconfirm --clean anime-nyaa.spec
          bash scripts/bundle-windows-runtime.sh dist/anime-nyaa/_internal
          bash scripts/bundle-gtk-icons.sh dist/anime-nyaa/_internal/share/icons
          bash scripts/bundle-ca-certificates.sh dist/anime-nyaa/_internal/certs
          bash scripts/bundle-gtk-typelibs.sh dist/anime-nyaa/_internal/gi_typelibs
          bash scripts/bundle-node-webtorrent.sh dist/anime-nyaa/_internal
          cp packaging/linux/anime-nyaa.png dist/anime-nyaa/
          cat > dist/anime-nyaa/README.txt <<'EOF'
          Anime Nyaa Windows executable bundle

          Run anime-nyaa.exe to start the application.
          GTK 4, Libadwaita, mpv, Node.js, and WebTorrent CLI are included in the bundle.
          Adwaita icon copyright and license are in _internal/licenses.
          EOF

      - name: Verify bundled Node.js, WebTorrent CLI, and mpv
        run: |
          node=dist/anime-nyaa/_internal/node/node.exe
          cli=dist/anime-nyaa/_internal/webtorrent-cli/node_modules/webtorrent-cli/bin/cmd.js
          helper=dist/anime-nyaa/_internal/anime/services/stream_episode.mjs
          mpv=dist/anime-nyaa/_internal/mpv.exe
          "$node" --version
          "$node" "$cli" --help >/dev/null
          test -s "$helper"
          "$node" --check "$helper"
          (cd dist/anime-nyaa/_internal/webtorrent-cli && \
            "$OLDPWD/$node" --input-type=module -e "import('node-datachannel')")
          "$mpv" --version >/dev/null

      - name: Smoke test packaged Windows GTK app
        timeout-minutes: 3
        env:
          NO_AT_BRIDGE: '1'
          GTK_A11Y: none
          GSK_RENDERER: cairo
        run: |
          set -o pipefail
          dist/anime-nyaa/anime-nyaa.exe --smoke-test 2>&1 | tee /tmp/anime-nyaa-windows-smoke.log
          if grep -q 'Traceback (most recent call last):' /tmp/anime-nyaa-windows-smoke.log; then
            echo 'The packaged Windows GTK startup logged a Python traceback.' >&2
            exit 1
          fi
          if grep -Eq 'AdwActionRow .* placed into GtkBox' /tmp/anime-nyaa-windows-smoke.log; then
            echo 'The packaged Windows GTK app placed an Adw.ActionRow into an unsupported GtkBox.' >&2
            exit 1
          fi

      - name: Build Windows installer (.exe) and portable (.zip)
        env:
          RELEASE_TAG: ${{ needs.reserve-version.outputs.tag || needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.reserve-version.outputs.version || needs.version.outputs.version }}
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$iscc" \
            "/DMyAppVersion=${RELEASE_VERSION}" \
            "/DMyOutputBaseFilename=anime-nyaa-windows-x86_64-setup-${RELEASE_TAG}" \
            "packaging/windows/anime-nyaa.iss"
          (cd dist && zip -qr "anime-nyaa-windows-x86_64-${RELEASE_TAG}.zip" anime-nyaa)
          (cd dist && sha256sum "anime-nyaa-windows-x86_64-setup-${RELEASE_TAG}.exe" "anime-nyaa-windows-x86_64-${RELEASE_TAG}.zip" > SHA256SUMS-windows.txt)
          ls -lh "dist/anime-nyaa-windows-x86_64-setup-${RELEASE_TAG}.exe" "dist/anime-nyaa-windows-x86_64-${RELEASE_TAG}.zip" dist/SHA256SUMS-windows.txt

      - name: Upload Windows installer (.exe) artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-nyaa-windows-installer
          path: dist/anime-nyaa-windows-x86_64-setup-*.exe
          if-no-files-found: error

      - name: Upload Windows portable bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-nyaa-windows-portable
          path: dist/anime-nyaa/*
          if-no-files-found: error

      - name: Upload Windows release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-nyaa-windows-release-assets
          path: |
            dist/anime-nyaa-windows-x86_64-setup-*.exe
            dist/anime-nyaa-windows-x86_64-*.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  verify-clean-windows:
    needs: [build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: anime-nyaa-windows-installer
          path: installer
      - name: Install and verify on a fresh Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $env:GSK_RENDERER = 'cairo'
          $env:GTK_A11Y = 'none'
          $installDir = Join-Path $env:RUNNER_TEMP 'Anime Nyaa clean test'
          $installer = (Get-ChildItem installer\*.exe | Select-Object -First 1).FullName
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $installDir + '"')) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exit code: $($install.ExitCode)" }
          $exe = Join-Path $installDir 'anime-nyaa.exe'
          if (!(Test-Path $exe)) { throw "Installed executable missing: $exe" }
          $app = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WorkingDirectory $env:RUNNER_TEMP -PassThru
          if (!$app.WaitForExit(60000)) { $app.Kill(); throw 'Installed app smoke test timed out' }
          if ($app.ExitCode -ne 0) { throw "Installed app exit code: $($app.ExitCode)" }
          $internal = Join-Path $installDir '_internal'
          $node = Join-Path $internal 'node\node.exe'
          $cli = Join-Path $internal 'webtorrent-cli\node_modules\webtorrent-cli\bin\cmd.js'
          & $node --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Node failed' }
          & $node $cli --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Bundled WebTorrent CLI failed' }
          & (Join-Path $internal 'mpv.exe') --version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Bundled mpv failed' }
          Write-Host 'Fresh runner: installer, GUI smoke test, Node, WebTorrent CLI and mpv succeeded.'

  release-windows:
    needs: [reserve-version, build-windows]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.reserve-version.result == 'success' &&
      needs.build-windows.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: anime-nyaa-windows-release-assets
          path: release-assets
      - name: Publish Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.reserve-version.outputs.tag }}
        run: |
          assets=(
            release-assets/anime-nyaa-windows-x86_64-setup-*.exe
            release-assets/anime-nyaa-windows-x86_64-*.zip
            release-assets/SHA256SUMS-windows.txt
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Anime Nyaa $RELEASE_TAG" \
              --generate-notes
          fi
