name: Linux release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build Linux source bundle
        run: |
          mkdir -p dist
          git archive --format=tar --prefix=anime-nyaa/ HEAD | gzip -n > "dist/anime-nyaa-linux-${GITHUB_REF_NAME}.tar.gz"
          sha256sum "dist/anime-nyaa-linux-${GITHUB_REF_NAME}.tar.gz" > "dist/anime-nyaa-linux-${GITHUB_REF_NAME}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Anime Nyaa $GITHUB_REF_NAME" --generate-notes

